name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record the host CPU
        # Which silicon produced a result is part of its provenance, and decision 0007 makes
        # the vendor specifically relevant.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'vendor_id' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|fma)$' | sort | tr '\n' ' '
          echo

      - name: nasm, which decides whether igzip is exact or merely valid
        # `gkl-deflate` links ISA-L for GKL's levels 1 and 2. Without an assembler ISA-L still
        # builds, still compresses, and still round-trips: it falls back to its readable C, which
        # finds different matches (decision 0034). The crate's canary catches that and makes those
        # levels refuse, so a missing nasm turns into a skipped comparison rather than a wrong
        # golden. Installed here so the comparison actually runs on the one host that can.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm && nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # Decision 0014: an operation-by-operation transcription of GPL2-only HotSpot source
        # was published in this MIT crate and found eleven commits later by reading module
        # headers. This makes that reading mechanical so the next one fails here instead.
        run: python3 tools/audit/provenance.py crates

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: Builds are reproducible
        # Two clean builds of the same source must produce the same bytes. A build that is not
        # reproducible cannot support a claim that its output is.
        run: |
          cargo build --release -p htsjdk-bgzf
          find target/release -maxdepth 1 -name 'libhtsjdk_bgzf*.rlib' -exec sha256sum {} \; > /tmp/build1.txt
          cargo clean
          cargo build --release -p htsjdk-bgzf
          find target/release -maxdepth 1 -name 'libhtsjdk_bgzf*.rlib' -exec sha256sum {} \; > /tmp/build2.txt
          diff <(cut -d' ' -f1 /tmp/build1.txt) <(cut -d' ' -f1 /tmp/build2.txt) \
            && echo "reproducible" \
            || { echo "BUILD IS NOT REPRODUCIBLE"; exit 1; }

  determinism:
    name: "Determinism: same input, different environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: The same paths, under three environments, are the same bytes
        # A byte-identity claim that only holds in one environment is not a byte-identity claim.
        # LC_ALL is the interesting one: decision 0011 established that metrics number formatting
        # is locale-dependent IN THE REFERENCE, which is why the oracle pins en_US. The port must
        # not have acquired the same dependency, so it is run under fr_FR, where a locale-sensitive
        # formatter would write "0,333333".
        #
        # This repository ships no tool, so the thing under test is an example that exercises the
        # paths a byte claim is made about and hashes them. TMPDIR is moved on one run and the
        # example writes into it, so a temporary directory it cannot use fails rather than skips.
        run: |
          set -eux
          mkdir -p /tmp/other-tmp
          P="cargo run --quiet --release -p htsjdk-metrics --example determinism_probe"
          $P > /tmp/run1.txt
          $P > /tmp/run2.txt
          TMPDIR=/tmp/other-tmp LC_ALL=fr_FR.UTF-8 $P > /tmp/run3.txt
          LC_ALL=C LANG=C $P > /tmp/run4.txt
          for f in /tmp/run2.txt /tmp/run3.txt /tmp/run4.txt; do
            diff /tmp/run1.txt "$f" \
              || { echo "the port is not deterministic across environments: $f"; exit 1; }
          done
          # And the copy the example left in TMPDIR is the same file, which is what says the run
          # under a moved TMPDIR really used it.
          diff /tmp/run1.txt /tmp/other-tmp/htsjdk-rs-determinism.txt \
            || { echo "the run under a moved TMPDIR wrote something else"; exit 1; }
          echo "four runs, three environments, identical"

  fuzz:
    name: "Differential fuzzing of the byte-level parsers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t htsjdk-rs-oracle:4.2.0 tools/oracle

      - name: Fuzz the parsers a hostile file reaches first
        # picard-rs fuzzes tools through their arguments. This repository ships no tool, so what
        # there is to fuzz is the parsers: pure functions of their bytes, with no state and no
        # environment, which is what makes a divergence a bug rather than a difference of setup.
        #
        # A short session on every run and a fixed seed per parser. The value is the regression
        # signal, a divergence that appears where there was none, not the depth of any one run; and
        # the seed is an argument rather than the clock so that a finding can be reproduced by
        # rerunning the command that found it.
        run: |
          set -eux
          python3 tools/fuzz/run_fuzz.py --parser itf8 --iterations 300 --seed 1
          python3 tools/fuzz/run_fuzz.py --parser ltf8 --iterations 300 --seed 1
          python3 tools/fuzz/run_fuzz.py --parser crai --iterations 300 --seed 1

      - name: Publish the findings
        # Findings are evidence, not goldens: they say what the reference did and where the port
        # differs. They are published rather than committed, because a finding produced anywhere
        # other than real x86-64 CI cannot be quoted (decision 0008).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: tools/fuzz/findings/
          if-no-files-found: ignore

  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. Editing the YAML by
        # hand is how the old file grew to 783 lines of drifted copies of one comparator, so a
        # hand edit fails here instead of surviving unnoticed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden that no suite regenerates can only ever be compared against itself.
        # format.txt.gz was in exactly that state; the audit makes the condition an invariant.
        run: python3 tools/conformance/audit_goldens.py

# The jobs below this line are generated from tools/conformance/manifest.json by
# tools/conformance/generate_ci.py. Edit the manifest, not this file: the `guard` job
# fails if the two disagree.
  oracle-image:
    name: Build the pinned oracle image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record the host CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - id: cache
        uses: actions/cache@v6
        with:
          path: /tmp/oracle-image.tar
          key: htsjdk-rs-oracle-4.2.0-${{ hashFiles('tools/oracle/**') }}

      - name: Build the oracle image
        # The probe runs during the build, so a degraded environment cannot produce an image, let
        # alone a golden. The image is built once and shared with every suite below, because
        # rebuilding it per suite would multiply a five-minute build by the number of suites.
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build --platform linux/amd64 -t htsjdk-rs-oracle:4.2.0 tools/oracle
          docker save htsjdk-rs-oracle:4.2.0 -o /tmp/oracle-image.tar

  oracle:
    name: "oracle ${{ matrix.group }} ${{ matrix.index }}"
    needs: oracle-image
    runs-on: ubuntu-latest
    strategy:
      # One suite's divergence must not cancel the others: the point of the run is to learn which
      # suites diverge, not to learn that at least one does.
      fail-fast: false
      matrix:
        include:
          - group: oracle-backed
            index: "1/16"
            slug: "tribble-bed-tribble-interval-list-tribble-vcf-candecode-zlib-bgzf"
            suites: "tribble-bed tribble-interval-list tribble-vcf-candecode zlib bgzf"
          - group: oracle-backed
            index: "2/16"
            slug: "bgzf-termination-bam-codec-bam-file-bam-header-version-fasta-reference-writer"
            suites: "bgzf-termination bam-codec bam-file bam-header-version fasta-reference-writer"
          - group: oracle-backed
            index: "3/16"
            slug: "bam-reheader-bam-gather-bam-tag-read-quality-util-duplicate-scoring"
            suites: "bam-reheader bam-gather bam-tag-read quality-util duplicate-scoring"
          - group: oracle-backed
            index: "4/16"
            slug: "downsampling-filter-histogram-sam-text-sam-file"
            suites: "downsampling filter histogram sam-text sam-file"
          - group: oracle-backed
            index: "5/16"
            slug: "bai-build-index-interval-list-vcf-header-vcf-header-parse"
            suites: "bai build-index interval-list vcf-header vcf-header-parse"
          - group: oracle-backed
            index: "6/16"
            slug: "vcf-header-lines-vcf-record-vcf-file-vcf-record-parse-vcf-genotype-parse"
            suites: "vcf-header-lines vcf-record vcf-file vcf-record-parse vcf-genotype-parse"
          - group: oracle-backed
            index: "7/16"
            slug: "vcf-read-vcf-index-on-the-fly-vcf-genotype-likelihoods-vcf-chromosome-counts-vcf-genotype-type"
            suites: "vcf-read vcf-index-on-the-fly vcf-genotype-likelihoods vcf-chromosome-counts vcf-genotype-type"
          - group: oracle-backed
            index: "8/16"
            slug: "vcf-attribute-type-rg-checksum-cigar-clip-mateinfo-format"
            suites: "vcf-attribute-type rg-checksum cigar-clip mateinfo format"
          - group: oracle-backed
            index: "9/16"
            slug: "percentile-fastmath-exp-gamma-erf-normal-saddle-point-binomial-inverse"
            suites: "percentile fastmath-exp gamma-erf-normal saddle-point binomial-inverse"
          - group: oracle-backed
            index: "10/16"
            slug: "variant-comparator-smart-merge-headers-tribble-index-tribble-index-write-cram-varint"
            suites: "variant-comparator smart-merge-headers tribble-index tribble-index-write cram-varint"
          - group: oracle-backed
            index: "11/16"
            slug: "cram-bit-stream-cram-core-codecs-cram-huffman-cram-external-codecs-cram-golomb"
            suites: "cram-bit-stream cram-core-codecs cram-huffman cram-external-codecs cram-golomb"
          - group: oracle-backed
            index: "12/16"
            slug: "cram-encoding-factory-cram-compression-header-cram-record-flags-cram-slice-blocks-cram-record-read"
            suites: "cram-encoding-factory cram-compression-header cram-record-flags cram-slice-blocks cram-record-read"
          - group: oracle-backed
            index: "13/16"
            slug: "cram-record-write-cram-crai-cram-negotiation-cram-file-read-cram-container"
            suites: "cram-record-write cram-crai cram-negotiation cram-file-read cram-container"
          - group: oracle-backed
            index: "14/16"
            slug: "cram-block-cram-rans-cram-rans-order1-cram-preservation-map-cram-substitution-matrix"
            suites: "cram-block cram-rans cram-rans-order1 cram-preservation-map cram-substitution-matrix"
          - group: oracle-backed
            index: "15/16"
            slug: "cram-encoding-map-cram-tag-encoding-map-cram-slice-header-cram-read-features-cram-record-cigar"
            suites: "cram-encoding-map cram-tag-encoding-map cram-slice-header cram-read-features cram-record-cigar"
          - group: oracle-backed
            index: "16/16"
            slug: "cram-restore-bases-mersenne-twister"
            suites: "cram-restore-bases mersenne-twister"
          - group: golden-pending
            index: "1/1"
            slug: "query-cigar-clip-3prime"
            suites: "query cigar-clip-3prime"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: /tmp/oracle-image.tar
          key: htsjdk-rs-oracle-4.2.0-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: Regenerate and compare
        # Every rule that canonicalizes anything away is declared in tools/conformance/manifest.json
        # with the reason it is there; tools/conformance/compare.py is the only code that applies
        # them. Run the same thing locally with:
        #   python3 tools/conformance/run_suite.py --suites "${{ matrix.suites }}"
        run: python3 tools/conformance/run_suite.py --suites "${{ matrix.suites }}"

      - name: Publish what the container produced
        # A `golden-pending` suite has no golden to compare against, and one may not be committed
        # from a developer machine (decision 0008). Its dump lands in tools/conformance/pending/
        # and is uploaded here; downloading it from this run and committing it is what turns the
        # suite into an oracle-backed one.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-goldens-${{ matrix.slug }}
          path: tools/conformance/pending/
          if-no-files-found: ignore

  oracle-probes:
    name: "probe: ${{ matrix.probe }}"
    needs: oracle-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: vcf-resort-stable
          - probe: vcf-contig-order
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: /tmp/oracle-image.tar
          key: htsjdk-rs-oracle-4.2.0-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: Run the probe
        # The port relies on it: writing a header that has already been through the comparator
        # once must not reorder it. Measured stable, not proven stable, so it is re-measured.
        # The cycle is the reason the port uses a total order where htsjdk has none. If a future
        # htsjdk made the comparator consistent, this fails and the divergence can be removed.
        run: python3 tools/conformance/run_suite.py --probe ${{ matrix.probe }}


  jvm-format-model:
    name: "Decision 0017: the JVM number-format model"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the oracle image
        # This job needs cargo as well as the image, so it stays hand-written: it asserts the
        # rates recorded in decision 0017 rather than byte equality, which is not what the
        # generated suites do.
        run: docker build --platform linux/amd64 -t htsjdk-rs-oracle:4.2.0 tools/oracle

      - name: "Decision 0017: does the JVM number-format model still hold?"
        # The sweep is 127,803 doubles, generated rather than committed. The test asserts the
        # rates recorded in decision 0017, so a regression in the model and a change in the
        # JDK's own formatting both fail here rather than passing quietly.
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/vcf-conformance":/harness:ro -w /work htsjdk-rs-oracle:4.2.0 \
            'cp /harness/JavaFormatSweep.java . && javac -d . JavaFormatSweep.java \
             && java -cp . JavaFormatSweep' > /tmp/jformat_sweep.txt
          wc -l /tmp/jformat_sweep.txt
          JFORMAT_SWEEP=/tmp/jformat_sweep.txt \
            cargo test -p htsjdk-vcf --test record_conformance -- --ignored --nocapture

  pow-portability:
    name: "Decision 0007: is Math.pow stable across silicon?"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record the host CPU
        # The whole point of this job. rcpps is specified by an error bound, not by exact
        # results, so the vendor and model are the experiment's independent variable.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'vendor_id' /proc/cpuinfo

      - name: Build the oracle image
        run: docker build --platform linux/amd64 -t htsjdk-rs-oracle:4.2.0 tools/oracle

      - name: Regenerate the math corpus on real silicon
        run: |
          curl -fsSL -o /tmp/commons-math3.jar \
            https://repo1.maven.org/maven2/org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar
          echo "1e56d7b058d28b65abd256b8458e3885b674c1d588fa43cd7d1cbb9c7ef2b308  /tmp/commons-math3.jar" | sha256sum -c -
          mkdir -p /tmp/out
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/jmath-conformance":/harness:ro -v /tmp:/j:ro -v /tmp/out:/out \
            -w /work htsjdk-rs-oracle:4.2.0 \
            'cp /harness/JMathDump.java . && javac -cp /j/commons-math3.jar -d . JMathDump.java \
             && java -cp .:/j/commons-math3.jar JMathDump /out/jmath.csv'
          wc -l /tmp/out/jmath.csv

      - name: "Is pow(x, 2) exactly x * x?"
        # Histogram.getStandardDeviation calls pow(value - mean, 2), which puts the deferred
        # pow intrinsic on the Phase 1 critical path. If the two agree, Histogram can be ported
        # with multiplication and the deferral holds. Measured here rather than assumed.
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/pow-probe":/harness:ro -w /work htsjdk-rs-oracle:4.2.0 \
            'cp /harness/PowSq.java . && javac -d . PowSq.java && java PowSq' | tee /tmp/powsq.txt
          grep -q 'differ=0$' /tmp/powsq.txt || {
            echo "pow(x, 2) is NOT x * x on this silicon. Histogram cannot use multiplication."
            exit 1
          }

      - name: Diff every function against the emulated corpus
        # Expectation from decision 0007: exp, log, log10 and sqrt agree, because none of them
        # depends on an unrefined approximate instruction. pow is the one under test.
        run: |
          python3 - <<'PY'
          import gzip, collections, sys
          def load(open_fn, path):
              d = {}
              with open_fn(path) as fh:
                  for line in fh:
                      if line.startswith('#'): continue
                      p = line.rstrip('\n').split(',')
                      if len(p) < 3: continue
                      d[(p[0], p[1])] = p[2]
              return d
          emulated = load(lambda p: gzip.open(p, 'rt'), 'crates/jmath/tests/data/jmath.csv.gz')
          real = load(open, '/tmp/out/jmath.csv')
          shared = set(emulated) & set(real)
          diff = collections.Counter(k[0] for k in shared if emulated[k] != real[k])
          total = collections.Counter(k[0] for k in shared)
          print(f"{'fn':<8} {'compared':>10} {'differing':>10}")
          for fn in sorted(total):
              print(f"{fn:<8} {total[fn]:>10} {diff.get(fn, 0):>10}")
          safe = [f for f in ('exp', 'log', 'log10', 'sqrt') if diff.get(f, 0)]
          if safe:
              print(f"\nFAIL: {safe} differ between emulated and real silicon. These are ported "
                    f"and asserted exact, so their goldens are now invalid.")
              sys.exit(1)
          if diff.get('pow', 0):
              print(f"\nDecision 0007 outcome: pow DIFFERS on real silicon "
                    f"({diff['pow']} of {total['pow']} points). The emulated pow column "
                    f"describes Rosetta, not hardware. Oracle for pow must move to real x86-64.")
              sys.exit(1)
          vendor = "unknown"
          for line in open('/proc/cpuinfo'):
              if line.startswith('vendor_id'):
                  vendor = line.split(':')[1].strip(); break
          print(f"\nDecision 0007 outcome: pow agrees between the emulated corpus and this "
                f"real host ({vendor}). Other vendors remain untested.")
          PY

  benchmark:
    name: "The I/O floor, on real x86-64"
    # Dispatch only. Issue #78 asks for a number, not a gate: this job costs several minutes of a
    # runner and its output moves with the runner's load, so running it on every push would spend
    # time to produce a figure nobody reads. What makes it worth having is the platform -- a number
    # from an emulated container on a developer machine measures the emulator.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record the host CPU
        # The figures below are a property of this line as much as of the code.
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - name: Build the oracle image
        run: docker build --platform linux/amd64 -t htsjdk-rs-oracle:4.2.0 tools/oracle

      - name: Time the port against htsjdk, on the same payloads
        # The runner asserts byte equality of every framed stream before it prints a single
        # duration: a speed number for a path whose bytes were not compared is not a measurement of
        # this port.
        run: tools/benchmark/run.sh 64 3 | tee /tmp/benchmark.txt

      - name: Publish the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: io-floor-benchmark
          path: /tmp/benchmark.txt
          if-no-files-found: ignore

  igzip-portability:
    name: "Decision 0028: does igzip emit the same bytes on every CPU?"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record the host CPU
        # The independent variable, and it is READ rather than assumed. Both backends dispatch on
        # CPUID: ISA-L ships isal_deflate_body_01/_02/_04 for SSE, AVX and AVX2, and Intel's zlib
        # fork gates its hash on x86_cpu_has_sse42. Two hosts advertising the same flags take the
        # same path, so agreement between them says nothing about the kernels. The probe prints
        # its own flags line into both columns; this step is the human-readable copy.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sse4_1|sse4_2|pclmulqdq|avx|avx2|avx512f)$' | sort -u | tr '\n' ' '
          echo

      - name: Build the oracle image
        run: docker build --platform linux/amd64 -t htsjdk-rs-oracle:4.2.0 tools/oracle

      - name: Compress on real silicon
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/gkl-probe":/harness:ro -w /work htsjdk-rs-oracle:4.2.0 \
            'cp /harness/GklProbe.java . && javac -cp "$ORACLE_CP" -d . GklProbe.java \
             && java -cp "$ORACLE_CP":. GklProbe' > /tmp/gkl-real.txt
          head -3 /tmp/gkl-real.txt

      - name: Diff every hash against the emulated column
        # Two questions at once. Whether GKL differs from the JDK at all is decision 0028's
        # first half and is re-asserted here so a GKL version bump that quietly dropped igzip
        # would be caught. Whether the hashes match the emulated run is 0028's open half, and
        # it decides whether H.4 has a fixed target to port to.
        run: |
          python3 - <<'PY'
          import sys
          def load(path):
              rows = {}
              for line in open(path):
                  parts = line.rstrip('\n').split('\t')
                  # env and cpu describe the run rather than the result, and must differ.
                  # `flags` is compared: two columns with the same flags did not test the
                  # kernel dispatch, and the report below has to be able to say so.
                  if parts[0] in ('deflate', 'bgzf', 'fixture', 'default-bgzf-level', 'flags'):
                      rows[tuple(parts[:-2] if parts[0] in ('deflate', 'bgzf') else parts[:-1])] = parts[-1]
              return rows
          committed = load('tools/gkl-probe/real-x86-64.txt')
          fresh = load('/tmp/gkl-real.txt')
          if not committed or not fresh:
              print("FAIL: one of the two columns is empty"); sys.exit(1)
          missing = set(committed) ^ set(fresh)
          if missing:
              print(f"FAIL: the two runs compared different things: {sorted(missing)[:5]}")
              sys.exit(1)
          differing = sorted(k for k in committed if committed[k] != fresh[k])
          # First half: does this GKL still split where decisions 0028 and 0029 say it does?
          #
          # Below 7 GKL is either igzip (levels 1 and 2) or Intel's patched zlib 1.2.13 (3 to 6),
          # and the JDK here is zlib 1.3.2, so the two disagree. At 7 and above the patches stop
          # mattering and the two zlibs emit the same bytes.
          #
          # Stated per level rather than per row on purpose. "GKL differs from the JDK below 7"
          # is not true of every input: the `runs` fixture compresses identically at levels 3
          # and 4, measured, because two match-finders can agree on data that simple. The claim
          # is asserted on `acgt`, which is the BAM-shaped fixture the level table was measured
          # on. The other direction admits no exceptions: EVERY row at 7 and above must agree.
          igzip_gone = [k for k in fresh if k[0] == 'deflate' and k[3] == 'gkl'
                        and k[1] == 'acgt' and int(k[2]) < 7
                        and fresh[k] == fresh[(k[0], k[1], k[2], 'jdk')]]
          if igzip_gone:
              print(f"FAIL: on the acgt fixture GKL matched the JDK at level(s) "
                    f"{sorted(int(k[2]) for k in igzip_gone)}. Either the native library did not "
                    f"load, or this GKL's zlib is no longer patched, or its version skew with the "
                    f"JDK's zlib closed. Decisions 0028 and 0029 no longer describe it.")
              sys.exit(1)
          zlib_gone = [k for k in fresh if k[0] == 'deflate' and k[3] == 'gkl' and int(k[2]) >= 7
                       and fresh[k] != fresh[(k[0], k[1], k[2], 'jdk')]]
          if zlib_gone:
              print(f"FAIL: GKL no longer matches the JDK at levels 7 to 9 "
                    f"({len(zlib_gone)} rows). Decision 0028 rests on those levels needing no "
                    f"port at all; they now need one. A JDK zlib bump is the likeliest cause.")
              sys.exit(1)
          # The flags line is reported, never asserted. It describes the experiment's reach.
          flags_key = ('flags',)
          same_dispatch = committed.get(flags_key) == fresh.get(flags_key)
          differing = [k for k in differing if k != flags_key]
          print(f"committed column flags: {committed.get(flags_key)}")
          print(f"this host flags:       {fresh.get(flags_key)}")
          print(f"{len(committed) - 1} rows compared, {len(differing)} differing")
          if differing:
              for key in differing[:10]:
                  print(f"  {'/'.join(key)}: committed={committed[key][:16]} fresh={fresh[key][:16]}")
              print(f"\nDecision 0028 outcome: igzip's output DEPENDS ON THE CPU. There is no "
                    f"single byte sequence to port to, and H.4 belongs with Math.pow in decision "
                    f"0007 rather than in the reproducible column.")
              sys.exit(1)
          print("\nDecision 0028 outcome: every hash agrees between the reference host and this "
                "one, so GKL's output does not move with the microarchitecture and H.4 has a "
                "fixed target.")
          if same_dispatch:
              print("BUT the two hosts advertise the SAME dispatch flags, so this run did not "
                    "compare kernels. To test the kernel dispatch, one column has to come from a "
                    "host whose flags differ.")
          PY

      - name: Publish the column this real host derived
        # The committed column, `tools/gkl-probe/real-x86-64.txt`, came from this artefact: it was
        # written on a developer machine first, which decision 0008 forbids for a golden, and was
        # replaced by a run of this job. Publishing it every time is what keeps that true.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gkl-probe-real-x86-64
          path: /tmp/gkl-real.txt
          if-no-files-found: warn

  ci:
    name: CI complete
    # The single context main's ruleset requires, and the single context an automatic merge waits
    # on. It runs whatever the jobs above did, because a gate that is skipped when something fails
    # reports nothing and blocks nothing.
    needs:
      - test
      - determinism
      - fuzz
      - guard
      - oracle-image
      - oracle
      - oracle-probes
      - jvm-format-model
      - pow-portability
      - benchmark
      - igzip-portability
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above succeeded
        # A skipped job is not a failure. A cancelled one is: a cancelled run has proved nothing,
        # and `success` on an empty result is how a green tick comes to mean less than it looks.
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          bad = sorted(
              name for name, job in results.items()
              if job["result"] not in ("success", "skipped")
          )
          for name in bad:
              print(f"{name}: {results[name]['result']}")
          print(f"{len(results) - len(bad)}/{len(results)} jobs green")
          sys.exit(1 if bad else 0)
          PY
