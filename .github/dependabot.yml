# Dependabot, for the two ecosystems this repository actually resolves: crates.io through
# Cargo.lock, and the actions .github/workflows/ci.yml names.
#
# Both run weekly and grouped, so a quiet week is one pull request per ecosystem rather than one
# per dependency. Minor and patch updates travel together; a major arrives on its own, because a
# major is a decision and deserves a diff with nothing else hiding in it.
#
# tools/oracle/Dockerfile deliberately has no entry. That container IS the oracle: it holds the
# reference's own toolchain, and every golden under tools/conformance/ was produced inside it.
# Bumping it would not be an upgrade, it would invalidate the comparison the whole suite rests on.
# It moves when the reference version moves, and never otherwise.
#
# The Rust toolchain is out of reach either way: rust-toolchain.toml is not an ecosystem
# Dependabot reads, and the workflow hands dtolnay/rust-toolchain@master a version written out as
# a string. Nothing compares the two but a comment, which is a gap this file cannot close.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # The compressors decide output bytes rather than merely read them: decision 0001 records
      # what happened when flate2 resolved to miniz_oxide instead of zlib. A bump of any of these
      # gets its own pull request, so the conformance run that judges it judges nothing else.
      deflate-backend:
        patterns:
          - "flate2"
          - "libz-sys"
          - "isal-sys"
      # noodles is read against rather than relied on for bytes: decision 0037 sets the rule. A
      # bump of it moves the comparator, not the port, so it too gets its own pull request.
      noodles:
        patterns:
          - "noodles-*"
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "flate2"
          - "libz-sys"
          - "isal-sys"
          - "noodles-*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
