[package]
name = "gkl-deflate"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A deflate compressor reproducing GKL's bytes, ported from zlib and ISA-L"

[features]
# Links ISA-L only to compare the igzip port with it (decision 0050). Levels 1 and 2 never use it.
# The comparison means something on x86-64 with nasm, where ISA-L runs the kernels GKL ships.
isal = ["dep:isal-sys"]

[dependencies]
# Decision 0034: igzip's readable C is not what GKL runs, so the port follows the x86 kernels, and
# this is the library to check it against.
isal-sys = { version = "0.5.3", optional = true }

[dev-dependencies]
flate2.workspace = true
# Only to compare against the sha256 column the oracle recorded; nothing in the crate hashes.
sha2 = "0.11"
