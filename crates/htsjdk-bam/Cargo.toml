[package]
name = "htsjdk-bam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Byte-level port of htsjdk's BAM record codec"

[dependencies]
htsjdk-bgzf = { path = "../htsjdk-bgzf" }
# QualityUtil is arithmetic before it is a utility: its phred conversion goes through Math.log10
# and Math.round, and both have a port here rather than an equivalent in std.
jmath = { path = "../jmath" }
md-5 = "0.11"

[dev-dependencies]
md-5 = "0.11"
flate2.workspace = true
htsjdk-bgzf = { path = "../htsjdk-bgzf" }
# A second, independent reader for the files this crate writes. A DEV dependency on purpose: it
# is an opinion to check against, never a source of bytes. See decision 0036.
noodles-bam = "0.94"
noodles-sam = "0.89"

