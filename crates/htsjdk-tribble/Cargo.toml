[package]
name = "htsjdk-tribble"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Port of htsjdk's Tribble feature codecs"

[dependencies]
htsjdk-bam = { path = "../htsjdk-bam" }
# The tabix index is written INSIDE a BGZF stream, so the compression is part of the format and
# not of the caller's plumbing.
htsjdk-bgzf = { path = "../htsjdk-bgzf" }
flate2.workspace = true

[dev-dependencies]
flate2.workspace = true
