[package]
name = "htsjdk-bgzf"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BGZF codec matching htsjdk's BlockCompressedOutputStream byte for byte"

[features]
# The benches' global allocator; see the workspace manifest.
mimalloc = ["dep:mimalloc"]
# Does nothing any more: `Deflater::Gkl` answers levels 1 and 2 in every build, since gkl-deflate
# ports igzip instead of linking ISA-L (decision 0050). Kept so manifests that enable it build.
gkl-igzip = []

[dependencies]
mimalloc = { workspace = true, optional = true }
# The deflater is a choice the FORMAT does not make: GATK replaces htsjdk's static factory with
# Intel's GKL, so a writer that knew only the JDK's could not reproduce anything GATK writes.
gkl-deflate = { path = "../gkl-deflate" }
flate2.workspace = true
# Deflates full blocks on every core; the bytes are the serial writer's (see `BgzfWriter`).
rayon = "1.12.0"
libz-sys.workspace = true
# htsjdk 5.0.0's default deflater: jlibdeflate 0.1.0, which builds libdeflate v1.25 from source. The
# version is pinned exactly because libdeflate's bytes, unlike its format, change between releases.
libdeflate-sys = "=1.26.1"

# The benchmark binary hashes what it writes, so the comparison is bytes before seconds. It is a
# normal dependency rather than a dev one because a `src/bin` target is not a test target.
[dependencies.md-5]
version = "0.11"

[dev-dependencies]
md-5 = "0.11"
rapidgzip-core = "=0.3.1"
