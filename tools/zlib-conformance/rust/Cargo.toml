# Its own workspace: this harness is a program the CI job runs, not a crate the port ships,
# and the port's workspace must not pick it up.
[workspace]

[package]
name = "r2"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
md-5 = "0.10"
